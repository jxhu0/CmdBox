name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: macos
            artifact_name: CmdBox-macos
            output_name: CmdBox.zip
          - os: windows-latest
            platform: windows
            artifact_name: CmdBox-windows
            output_name: CmdBox.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flet-cli pyinstaller flet-desktop

      - name: Build ${{ matrix.platform }}
        run: |
          pyinstaller --name CmdBox --windowed --onedir --icon assets/icon.ico --hidden-import=pyperclip --hidden-import=pyperclip.__init__ app.py

      - name: Create zip for macOS
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          zip -r CmdBox.zip CmdBox.app

      - name: Create zip for Windows
        if: matrix.os == 'windows-latest'
        run: |
          cd dist
          powershell Compress-Archive -Path CmdBox -DestinationPath CmdBox.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.output_name }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: |
          ls -laR artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/CmdBox-macos/CmdBox.zip
            artifacts/CmdBox-windows/CmdBox.zip
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
