name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: macos
            artifact_name: CmdBox-macos
            output_name: CmdBox.zip
          - os: windows-latest
            platform: windows
            artifact_name: CmdBox-windows
            output_name: CmdBox.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flet-cli pyinstaller flet-desktop Pillow

      - name: Build macOS
        if: matrix.platform == 'macos'
        run: |
          pyinstaller --name CmdBox --windowed --onedir --icon assets/icon.icns --hidden-import=pyperclip --hidden-import=pyperclip.__init__ main.py

      - name: Build Windows
        if: matrix.platform == 'windows'
        run: |
          pyinstaller --name CmdBox --windowed --onefile --icon assets/icon.ico --hidden-import=pyperclip --hidden-import=pyperclip.__init__ main.py

      - name: Create zip for macOS
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          zip -r CmdBox.zip CmdBox.app

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.output_name }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: CmdBox-macos
          path: artifacts/macos

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: CmdBox-windows
          path: artifacts/windows

      - name: List artifacts
        run: |
          ls -laR artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/macos/CmdBox.zip
            artifacts/windows/CmdBox.exe
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
