<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CmdBox — 命令行指令管理工具</title>
<meta name="description" content="CmdBox 是一款专为开发者打造的命令行指令与大模型 Prompt 管理工具。分类存储、一键复制、Git 同步，让常用指令触手可及。">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;background:#07090F;color:#F8FAFC;overflow-x:hidden}

  .bg-grid{position:fixed;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.03) 1px,transparent 0);background-size:40px 40px;pointer-events:none;z-index:0}
  .bg-glow-1{position:fixed;top:-300px;left:-200px;width:700px;height:700px;background:radial-gradient(circle,rgba(59,130,246,.08) 0%,transparent 60%);pointer-events:none;z-index:0}
  .bg-glow-2{position:fixed;bottom:-300px;right:-200px;width:700px;height:700px;background:radial-gradient(circle,rgba(139,92,246,.06) 0%,transparent 60%);pointer-events:none;z-index:0}

  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
  @keyframes fade-up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}

  .animate-on-scroll{opacity:0;transform:translateY(24px);transition:opacity .6s cubic-bezier(.16,1,.3,1),transform .6s cubic-bezier(.16,1,.3,1)}
  .animate-on-scroll.visible{opacity:1;transform:translateY(0)}

  @media(prefers-reduced-motion:reduce){
    .app-mockup{animation:none!important}
    .animate-on-scroll{transition:none!important;opacity:1!important;transform:none!important}
    .hero-badge-dot{animation:none!important}
    .hero-badge,.hero h1,.hero p,.hero-buttons,.stats-bar,.mockup-section{animation:none!important;opacity:1!important;transform:none!important}
  }

  .nav{position:fixed;top:16px;left:16px;right:16px;z-index:50;backdrop-filter:blur(20px) saturate(180%);background:rgba(7,9,15,.7);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:0 20px;animation:fade-up .6s ease-out}
  .nav-inner{max-width:1168px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:56px}
  .nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:#F8FAFC}
  .nav-logo svg{width:30px;height:30px}
  .nav-logo span{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;letter-spacing:-.5px}
  .nav-links{display:flex;align-items:center;gap:6px}
  .nav-links a{color:#94A3B8;text-decoration:none;font-size:13px;padding:6px 12px;border-radius:8px;transition:all 200ms ease;cursor:pointer}
  .nav-links a:hover{color:#F8FAFC;background:rgba(255,255,255,.06)}
  .nav-github{display:flex;align-items:center;color:#94A3B8;text-decoration:none;padding:6px;border-radius:8px;transition:all 200ms ease;cursor:pointer}
  .nav-github:hover{color:#F8FAFC;background:rgba(255,255,255,.06)}
  .nav-lang{color:#64748B;font-size:12px;font-weight:600;padding:5px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.03);cursor:pointer;transition:all 200ms ease;font-family:'JetBrains Mono',monospace;letter-spacing:.5px}
  .nav-lang:hover{color:#CBD5E1;background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1)}
  .nav-cta{background:#fff;color:#07090F!important;padding:7px 18px!important;border-radius:8px;font-weight:600!important;font-size:13px;cursor:pointer;transition:all 200ms ease;border:none}
  .nav-cta:hover{background:#E2E8F0;transform:translateY(-1px)}

  .hero{position:relative;padding:140px 24px 60px;text-align:center;z-index:1}
  .hero-glow{position:absolute;top:0;left:50%;transform:translateX(-50%);width:900px;height:600px;background:radial-gradient(ellipse at 50% 0%,rgba(99,102,241,.12) 0%,rgba(59,130,246,.06) 40%,transparent 70%);pointer-events:none}
  .hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.15);padding:5px 4px 5px 16px;border-radius:100px;font-size:13px;color:#60A5FA;margin-bottom:32px;animation:fade-up .6s ease-out .1s both}
  .hero-badge-dot{width:7px;height:7px;border-radius:50%;background:#22C55E;margin-right:4px;animation:pulse-dot 2s ease-in-out infinite}
  .hero-badge-version{background:rgba(255,255,255,.08);padding:5px 12px;border-radius:100px;font-size:12px;color:#94A3B8;font-family:'JetBrains Mono',monospace}
  .hero h1{font-family:'Space Grotesk',sans-serif;font-size:64px;font-weight:700;letter-spacing:-2px;line-height:1.08;margin-bottom:24px;position:relative;animation:fade-up .6s ease-out .2s both}
  .hero h1 .gradient-text{background:linear-gradient(135deg,#60A5FA 0%,#A78BFA 40%,#F472B6 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .hero p{font-size:18px;color:#94A3B8;max-width:540px;margin:0 auto 40px;line-height:1.7;animation:fade-up .6s ease-out .3s both}
  .hero-buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;animation:fade-up .6s ease-out .4s both}
  .btn-primary{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#07090F;padding:12px 28px;border-radius:10px;font-weight:600;font-size:15px;text-decoration:none;cursor:pointer;transition:all 200ms ease;border:none;font-family:'DM Sans',sans-serif;box-shadow:0 0 20px rgba(255,255,255,.08)}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(255,255,255,.12)}
  .btn-secondary{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:#CBD5E1;padding:12px 24px;border-radius:10px;font-weight:500;font-size:14px;text-decoration:none;cursor:pointer;transition:all 200ms ease;font-family:'DM Sans',sans-serif}
  .btn-secondary:hover{background:rgba(255,255,255,.08);color:#F8FAFC;border-color:rgba(255,255,255,.15)}

  .stats-bar{display:flex;justify-content:center;gap:48px;padding:32px 24px 0;animation:fade-up .6s ease-out .5s both;position:relative;z-index:1}
  .stat-item{text-align:center}
  .stat-value{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;color:#F1F5F9;letter-spacing:-.5px}
  .stat-value .accent{color:#60A5FA}
  .stat-label{font-size:13px;color:#475569;margin-top:2px}
  .stat-divider{width:1px;background:rgba(255,255,255,.06);align-self:stretch}

  .mockup-section{max-width:920px;margin:60px auto 0;padding:0 24px;position:relative;z-index:1;animation:fade-up .8s ease-out .6s both}
  .app-mockup{background:#0E1219;border:1px solid rgba(255,255,255,.08);border-radius:16px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.04),0 24px 80px -12px rgba(0,0,0,.5),0 0 60px -10px rgba(59,130,246,.1);animation:float 6s ease-in-out infinite;position:relative}
  .app-mockup::before{content:'';position:absolute;inset:0;border-radius:16px;padding:1px;background:linear-gradient(180deg,rgba(59,130,246,.15) 0%,transparent 40%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
  .mockup-titlebar{display:flex;align-items:center;gap:8px;padding:14px 18px;background:rgba(255,255,255,.02);border-bottom:1px solid rgba(255,255,255,.05)}
  .mockup-dots{display:flex;gap:7px}
  .mockup-dot{width:11px;height:11px;border-radius:50%}
  .mockup-dot:nth-child(1){background:#FF5F57}
  .mockup-dot:nth-child(2){background:#FEBC2E}
  .mockup-dot:nth-child(3){background:#28C840}
  .mockup-titlebar-text{flex:1;text-align:center;font-size:12px;color:#475569;font-family:'DM Sans',sans-serif}
  .mockup-body{padding:16px;min-height:320px;display:flex;gap:12px}
  .mockup-sidebar{width:170px;flex-shrink:0;background:rgba(255,255,255,.02);border-radius:10px;padding:12px 10px;border:1px solid rgba(255,255,255,.04);display:flex;flex-direction:column;gap:2px}
  .mockup-sidebar-item{padding:7px 10px;border-radius:6px;font-size:12px;color:#64748B;cursor:pointer;transition:all 150ms ease;display:flex;align-items:center;gap:8px}
  .mockup-sidebar-item:hover{color:#94A3B8;background:rgba(255,255,255,.03)}
  .mockup-sidebar-item.active{background:rgba(59,130,246,.12);color:#60A5FA}
  .mockup-sidebar-item svg{width:14px;height:14px;flex-shrink:0}
  .mockup-sidebar-divider{height:1px;background:rgba(255,255,255,.04);margin:6px 4px}
  .mockup-sidebar-label{font-size:10px;color:#334155;text-transform:uppercase;letter-spacing:1.2px;font-weight:600;padding:4px 10px 6px}
  .mockup-content{flex:1;display:flex;flex-direction:column;gap:8px}
  .mockup-toolbar{display:flex;align-items:center;gap:8px}
  .mockup-search{flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:8px 12px;display:flex;align-items:center;gap:8px;color:#334155;font-size:12px}
  .mockup-search svg{width:13px;height:13px;color:#475569}
  .mockup-search kbd{margin-left:auto;font-size:10px;color:#334155;background:rgba(255,255,255,.04);padding:1px 6px;border-radius:4px;border:1px solid rgba(255,255,255,.06);font-family:'JetBrains Mono',monospace}
  .mockup-toolbar-btn{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);color:#475569;cursor:pointer}
  .mockup-toolbar-btn svg{width:14px;height:14px}
  .mockup-cards{display:flex;flex-direction:column;gap:6px;flex:1}
  .mockup-card{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.04);border-radius:9px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;transition:all 150ms ease;cursor:pointer}
  .mockup-card:hover{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.08)}
  .mockup-card-left{display:flex;align-items:center;gap:10px}
  .mockup-card-icon{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center}
  .mockup-card-icon svg{width:14px;height:14px}
  .mockup-card-icon.blue{background:rgba(59,130,246,.12);color:#60A5FA}
  .mockup-card-icon.purple{background:rgba(139,92,246,.12);color:#A78BFA}
  .mockup-card-icon.green{background:rgba(34,197,94,.12);color:#4ADE80}
  .mockup-card-icon.amber{background:rgba(245,158,11,.12);color:#FBBF24}
  .mockup-card-info{display:flex;flex-direction:column;gap:2px}
  .mockup-card-title{font-size:12px;color:#CBD5E1;font-weight:500;font-family:'JetBrains Mono',monospace}
  .mockup-card-desc{font-size:10px;color:#475569}
  .mockup-card-right{display:flex;align-items:center;gap:6px}
  .mockup-card-tag{font-size:10px;color:#475569;background:rgba(255,255,255,.03);padding:2px 7px;border-radius:4px}
  .mockup-card-action{font-size:10px;color:#64748B;cursor:pointer;padding:4px 8px;border-radius:5px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.05);transition:all 150ms ease;display:flex;align-items:center;gap:4px}
  .mockup-card-action:hover{background:rgba(59,130,246,.1);color:#60A5FA;border-color:rgba(59,130,246,.2)}
  .mockup-card-action svg{width:10px;height:10px}
  .mockup-card-star{color:#FBBF24;display:flex}
  .mockup-card-star svg{width:12px;height:12px}

  .section-label{font-size:12px;color:#3B82F6;text-transform:uppercase;letter-spacing:2.5px;font-weight:600;text-align:center;margin-bottom:14px}
  .section-title{font-family:'Space Grotesk',sans-serif;font-size:38px;font-weight:700;text-align:center;letter-spacing:-.8px;margin-bottom:16px;line-height:1.15}
  .section-desc{font-size:16px;color:#64748B;text-align:center;max-width:480px;margin:0 auto 60px;line-height:1.7}

  .features{max-width:1100px;margin:0 auto;padding:120px 24px 0;position:relative;z-index:1}
  .features-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .feature-card{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);border-radius:14px;padding:28px;transition:all 250ms ease;cursor:pointer;position:relative;overflow:hidden}
  .feature-card::before{content:'';position:absolute;inset:0;border-radius:14px;background:radial-gradient(circle at 50% 0%,var(--card-glow,rgba(59,130,246,.06)) 0%,transparent 60%);opacity:0;transition:opacity 300ms ease}
  .feature-card:hover::before{opacity:1}
  .feature-card:hover{border-color:rgba(255,255,255,.1);transform:translateY(-2px)}
  .feature-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:18px;position:relative;z-index:1}
  .feature-icon svg{width:20px;height:20px}
  .feature-icon.blue{background:rgba(59,130,246,.1);color:#60A5FA}
  .feature-icon.purple{background:rgba(139,92,246,.1);color:#A78BFA}
  .feature-icon.green{background:rgba(34,197,94,.1);color:#4ADE80}
  .feature-icon.amber{background:rgba(245,158,11,.1);color:#FBBF24}
  .feature-icon.rose{background:rgba(244,63,94,.1);color:#FB7185}
  .feature-icon.cyan{background:rgba(6,182,212,.1);color:#22D3EE}
  .feature-card h3{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;margin-bottom:8px;color:#E2E8F0;position:relative;z-index:1}
  .feature-card p{font-size:13px;color:#475569;line-height:1.7;position:relative;z-index:1}

  .highlight{max-width:1100px;margin:0 auto;padding:100px 24px 0;position:relative;z-index:1}
  .highlight-card{background:rgba(255,255,255,.015);border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:56px;display:flex;align-items:center;gap:56px;position:relative;overflow:hidden}
  .highlight-card::before{content:'';position:absolute;top:-50%;left:-20%;width:60%;height:200%;background:radial-gradient(ellipse,rgba(59,130,246,.06) 0%,transparent 60%);pointer-events:none}
  .highlight-text{flex:1;position:relative;z-index:1}
  .highlight-text h3{font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700;margin-bottom:16px;letter-spacing:-.5px;line-height:1.2}
  .highlight-text p{font-size:15px;color:#64748B;line-height:1.8;margin-bottom:24px}
  .highlight-features{display:flex;flex-direction:column;gap:10px;margin-bottom:28px}
  .highlight-feature-item{display:flex;align-items:center;gap:10px;font-size:14px;color:#94A3B8}
  .highlight-feature-item svg{width:16px;height:16px;color:#22C55E;flex-shrink:0}
  .highlight-visual{flex:1;position:relative;z-index:1}
  .sync-diagram{background:rgba(0,0,0,.25);border-radius:16px;padding:32px 24px;border:1px solid rgba(255,255,255,.05)}
  .sync-flow{display:flex;align-items:center;justify-content:center;gap:12px}
  .sync-node{display:flex;flex-direction:column;align-items:center;gap:10px}
  .sync-node-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);transition:all 300ms ease}
  .sync-node-icon:hover{border-color:rgba(59,130,246,.3)}
  .sync-node-icon svg{width:22px;height:22px}
  .sync-node-label{font-size:12px;color:#64748B;font-weight:500}
  .sync-arrow svg{width:20px;height:20px;color:#334155}

  .how-it-works{max-width:900px;margin:0 auto;padding:100px 24px 0;position:relative;z-index:1}
  .steps{display:flex;flex-direction:column;gap:0;position:relative}
  .steps::before{content:'';position:absolute;left:23px;top:24px;bottom:24px;width:1px;background:linear-gradient(180deg,rgba(59,130,246,.3) 0%,rgba(139,92,246,.3) 50%,rgba(255,255,255,.05) 100%)}
  .step{display:flex;gap:24px;padding:20px 0;position:relative}
  .step-number{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;flex-shrink:0;position:relative;z-index:1}
  .step:nth-child(1) .step-number{background:rgba(59,130,246,.12);color:#60A5FA}
  .step:nth-child(2) .step-number{background:rgba(139,92,246,.12);color:#A78BFA}
  .step:nth-child(3) .step-number{background:rgba(34,197,94,.12);color:#4ADE80}
  .step-content{padding-top:4px}
  .step-content h3{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:600;margin-bottom:6px;color:#E2E8F0}
  .step-content p{font-size:14px;color:#475569;line-height:1.7}

  .download{text-align:center;padding:120px 24px 40px;max-width:640px;margin:0 auto;position:relative;z-index:1}
  .download-cta-box{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:24px;padding:56px 40px;position:relative;overflow:hidden}
  .download-cta-box::before{content:'';position:absolute;top:-100px;left:50%;transform:translateX(-50%);width:400px;height:300px;background:radial-gradient(ellipse,rgba(59,130,246,.08) 0%,transparent 60%);pointer-events:none}
  .download h2{font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:700;margin-bottom:12px;letter-spacing:-.5px;position:relative}
  .download p{color:#64748B;font-size:15px;margin-bottom:36px;line-height:1.7;position:relative}
  .download-buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;position:relative}
  .download-btn{display:inline-flex;align-items:center;gap:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px 24px;text-decoration:none;color:#F8FAFC;cursor:pointer;transition:all 250ms ease;min-width:190px}
  .download-btn:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.15);transform:translateY(-2px)}
  .download-btn svg{width:26px;height:26px;opacity:.9}
  .download-btn-text{text-align:left}
  .download-btn-text small{font-size:11px;color:#475569;display:block;margin-bottom:1px}
  .download-btn-text span{font-size:14px;font-weight:600}

  .footer{border-top:1px solid rgba(255,255,255,.04);padding:28px 24px;position:relative;z-index:1}
  .footer-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;color:#334155;font-size:13px}
  .footer-left{display:flex;align-items:center;gap:6px}
  .footer-left svg{width:16px;height:16px;opacity:.5}
  .footer-links{display:flex;gap:20px}
  .footer-links a{color:#475569;text-decoration:none;transition:color 200ms;cursor:pointer;font-size:13px}
  .footer-links a:hover{color:#94A3B8}

  @media(max-width:768px){
    .hero{padding:120px 20px 40px}
    .hero h1{font-size:40px;letter-spacing:-1px}
    .hero p{font-size:16px}
    .stats-bar{gap:24px;flex-wrap:wrap}
    .stat-value{font-size:22px}
    .stat-divider{display:none}
    .features-grid{grid-template-columns:1fr}
    .highlight-card{flex-direction:column;padding:32px 24px;gap:32px}
    .highlight-text h3{font-size:24px}
    .footer-inner{flex-direction:column;gap:14px}
    .nav-links a:not(.nav-cta):not(.nav-lang){display:none}
    .mockup-body{flex-direction:column}
    .mockup-sidebar{width:100%}
    .app-mockup{animation:none}
    .download-cta-box{padding:36px 24px}
    .sync-flow{flex-direction:column;gap:8px}
    .sync-arrow svg{transform:rotate(90deg)}
    .section-title{font-size:28px}
    .nav{top:8px;left:8px;right:8px}
  }
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow-1"></div>
<div class="bg-glow-2"></div>

<!-- NAV -->
<nav class="nav">

<script>
  // Language toggle
  let currentLang = localStorage.getItem('cmdbox-lang') || 'zh';

  function applyLang(lang) {
    currentLang = lang;
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    document.querySelectorAll('[data-lang-zh]').forEach(el => {
      el.textContent = el.getAttribute('data-lang-' + lang);
    });
    document.getElementById('langToggle').textContent = lang === 'zh' ? 'EN' : '中';
    document.title = lang === 'zh'
      ? 'CmdBox — 命令行指令管理工具'
      : 'CmdBox — Command Line Snippet Manager';
  }

  function toggleLang() {
    applyLang(currentLang === 'zh' ? 'en' : 'zh');
    localStorage.setItem('cmdbox-lang', currentLang);
  }

  applyLang(currentLang);

  // Scroll animation observer
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) entry.target.classList.add('visible');
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });

  document.querySelectorAll('.animate-on-scroll').forEach(el => observer.observe(el));

  // Smooth scroll for anchor links
  document.querySelectorAll('a[href^="#"]').forEach(anchor => {
    anchor.addEventListener('click', function(e) {
      e.preventDefault();
      const target = document.querySelector(this.getAttribute('href'));
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
</script>
